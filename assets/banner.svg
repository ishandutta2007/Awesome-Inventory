<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 58px;
        fill: url(#textGrad);
      }
      .subtitle {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
        letter-spacing: 1px;
      }
      .badge-text {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 13px;
        fill: #38bdf8;
      }
      
      @keyframes floatBox {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }

      @keyframes pulsePulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.8; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }

      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }

      .floating-card {
        animation: floatBox 6s ease-in-out infinite;
      }
      .pulsing-glow {
        animation: pulsePulse 4s ease-in-out infinite;
        transform-origin: center;
      }
      .flowing-line {
        stroke-dasharray: 8 8;
        animation: dashFlow 2s linear infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic / Animated Background Graphics (Positioned around text, foreground clear) -->
  <circle cx="200" cy="80" r="140" fill="#3b82f6" opacity="0.15" filter="url(#glow)" class="pulsing-glow" />
  <circle cx="1000" cy="240" r="160" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" class="pulsing-glow" />

  <!-- Right Side Visual Warehouse Nodes -->
  <g transform="translate(820, 50)">
    <path d="M 50,60 L 180,60 L 240,140 L 300,140" stroke="#6366f1" stroke-width="2" fill="none" opacity="0.6" class="flowing-line" />
    <path d="M 50,160 L 120,160 L 180,90 L 280,90" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6" class="flowing-line" />

    <g class="floating-card">
      <rect x="30" y="30" width="110" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <rect x="45" y="45" width="40" height="8" rx="4" fill="#38bdf8" />
      <rect x="45" y="60" width="65" height="6" rx="3" fill="#64748b" />
      <circle cx="120" cy="49" r="5" fill="#22c55e" />

      <rect x="160" y="110" width="120" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <rect x="175" y="125" width="50" height="8" rx="4" fill="#a855f7" />
      <rect x="175" y="140" width="75" height="6" rx="3" fill="#64748b" />
      <rect x="175" y="153" width="35" height="6" rx="3" fill="#475569" />
      <circle cx="260" cy="129" r="5" fill="#38bdf8" />
    </g>
  </g>

  <!-- Left Barcode Accents -->
  <g transform="translate(60, 60)" opacity="0.25">
    <rect x="0" y="0" width="4" height="200" fill="#38bdf8" />
    <rect x="10" y="0" width="12" height="200" fill="#38bdf8" />
    <rect x="28" y="0" width="6" height="200" fill="#38bdf8" />
    <rect x="40" y="0" width="16" height="200" fill="#38bdf8" />
    <rect x="62" y="0" width="4" height="200" fill="#38bdf8" />
    <rect x="72" y="0" width="8" height="200" fill="#38bdf8" />
  </g>

  <!-- Foreground Text Content -->
  <g transform="translate(100, 100)">
    <g transform="translate(0, 0)">
      <rect width="210" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="15" y="20" class="badge-text">📦 ECOSYSTEM DIRECTORY</text>
    </g>
    <text x="0" y="82" class="title">Awesome Inventory</text>
    <text x="0" y="122" class="subtitle">Top SaaS &amp; Open-Source Inventory Management Software</text>
  </g>
</svg>
