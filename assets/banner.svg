<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatBox{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(2deg)}}@keyframes pulsePulse{0%{opacity:.3;transform:scale(.98)}50%{opacity:.8;transform:scale(1.02)}}.title{font-weight:900;font-size:58px;fill:url(#textGrad)}.badge-text,.subtitle,.title{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8;letter-spacing:1px}.badge-text{font-weight:700;font-size:13px;fill:#38bdf8}.floating-card{animation:floatBox 6s ease-in-out infinite}.pulsing-glow{animation:pulsePulse 4s ease-in-out infinite;transform-origin:center}.flowing-line{stroke-dasharray:8 8;animation:dashFlow 2s linear infinite}</style></defs><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><circle cx="200" cy="80" r="140" fill="#3b82f6" class="pulsing-glow" filter="url(#glow)" opacity=".15"/><circle cx="1000" cy="240" r="160" fill="#8b5cf6" class="pulsing-glow" filter="url(#glow)" opacity=".15"/><g><path fill="none" stroke="#6366f1" stroke-width="2" d="M 50,60 L 180,60 L 240,140 L 300,140" class="flowing-line" opacity=".6" transform="translate(820, 50)"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 50,160 L 120,160 L 180,90 L 280,90" class="flowing-line" opacity=".6" transform="translate(820, 50)"/><g